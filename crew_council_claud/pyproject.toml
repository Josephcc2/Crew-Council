[project]
name = "crew_council_claud"
version = "0.1.0"
description = "crew-council-claud using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "anthropic>=0.25.0"
]

[project.scripts]
crew_council_claud = "crew_council_claud.main:run"
run_crew = "crew_council_claud.main:run"
train = "crew_council_claud.main:train"
replay = "crew_council_claud.main:replay"
test = "crew_council_claud.main:test"
run_with_trigger = "crew_council_claud.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
